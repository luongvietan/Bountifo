<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bugcrowd Engagement Radar</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Bugcrowd</p>
        <h1>Engagement Radar</h1>
      </header>
      <div class="controls">
        <button id="scan" class="primary">Scan programs</button>
        <button id="refresh" class="quiet">Refresh</button>
        <button id="cancel" class="danger" hidden>Cancel scan</button>
        <label for="profile" class="muted">Profile</label>
        <select id="profile"></select>
        <span id="mode-control" hidden>
          <label for="mode" class="muted">View</label>
          <select
            id="mode"
            title="Evidence level of the ranking — Deep ranking lists only programs with deep-stage scores; All candidates ranks every program by its metadata score."
          >
            <option value="deep">Deep ranking</option>
            <option value="metadata">All candidates (metadata)</option>
          </select>
        </span>
        <span id="mode-note" class="muted"></span>
      </div>
      <p id="status" class="muted" aria-live="polite">Loading…</p>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <fieldset class="filters">
        <legend class="muted">Filter results</legend>
        <label for="f-saturation">Saturation ≤</label>
        <input id="f-saturation" type="number" min="0" max="1" step="0.05" />
        <label for="f-ki">KI Pressure ≤</label>
        <input
          id="f-ki"
          type="number"
          min="0"
          max="1"
          step="0.05"
          title="Known-Issue pressure proxy from unique known issues and meaningful target surface — not duplicate probability."
        />
        <label for="f-opportunity">Opportunity ≥</label>
        <input id="f-opportunity" type="number" min="0" max="1" step="0.05" />
        <label for="f-reward">Reward ≥</label>
        <input id="f-reward" type="number" min="0" max="1" step="0.05" />
        <label for="f-apiheavy" class="check">
          <input id="f-apiheavy" type="checkbox" /> API-heavy
        </label>
      </fieldset>
      <table id="results">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Program</th>
            <th>Score</th>
            <th>Reward</th>
            <th>Surface</th>
            <th>Saturation</th>
            <th
              title="Known-Issue pressure proxy from unique known issues and meaningful target surface — not duplicate probability."
            >
              KI Pressure
            </th>
            <th
              title="Semantic changelog expansion score — latest vs previous brief; not a bug-finding probability."
            >
              Opportunity
            </th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <section id="detail" hidden>
        <h2 id="detail-title"></h2>
        <p id="detail-meta" class="muted"></p>
        <table id="components">
          <thead>
            <tr>
              <th>Signal</th>
              <th>Value</th>
              <th>Weight</th>
              <th>Contribution</th>
            </tr>
          </thead>
          <tbody id="components-body"></tbody>
        </table>
        <h3>Research saturation</h3>
        <table id="saturation">
          <tbody id="saturation-body"></tbody>
        </table>
        <div id="deep-groups"></div>
        <h3>Explanation</h3>
        <ul id="explanation"></ul>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
